<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta http-equiv="refresh" content="900"><title>Bot cripto</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon-180.png"><meta name="theme-color" content="#0b0f0d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Bot cripto"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><style>
:root{--bg:#0b0f0d;--panel:#121815;--panel2:#19211d;--line:#232c27;--fg:#eef3ef;--muted:#8d9a92;
--up:#2fd28b;--down:#ff6b5e;--warn:#ffb43c;--acc:#2fd28b;--c1:#2fd28b;--c2:#6fa0e8;--c3:#e0b04a;--c4:#b98ae0;--c5:#ec8a6c;
--font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:dark}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased;
-webkit-tap-highlight-color:transparent}
.num,.big,.v{font-variant-numeric:tabular-nums}
h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-.01em}h2{font-size:14px;margin:0;font-weight:700}
.sub,.s,.l{color:var(--muted);font-size:12px}.note{color:var(--muted);font-size:13px;margin:0;max-width:80ch}
.up{color:var(--up)}.down{color:var(--down)}b{font-weight:700}
/* entrada */
.lockscreen{min-height:100vh;display:grid;place-items:center;padding:24px;
background:radial-gradient(circle at 50% 25%,#123224,var(--bg) 60%)}
.lockbox{width:min(340px,100%);display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.lockbox .logo{width:64px;height:64px;font-size:28px;border-radius:18px}
.lockbox input[type=password]{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);
color:var(--fg);font:inherit;font-size:16px}
.lockbox button{width:100%;padding:14px;border-radius:12px;border:0;background:var(--acc);color:#06120c;font:inherit;
font-weight:700;font-size:15px;cursor:pointer}
.lockbox label{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:13px}
.err{color:var(--down);font-size:13px;min-height:1em}
/* armazón */
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#2fd28b,#139a62);display:grid;place-items:center;
color:#06120c;font-weight:800}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--panel);border-right:1px solid var(--line);padding:22px 14px;
display:flex;flex-direction:column;gap:22px}
.side .brand{margin:0 8px}
.snav{display:flex;flex-direction:column;gap:4px}
.snav a,.tabbar a{display:flex;align-items:center;gap:10px;color:var(--muted);text-decoration:none;font-weight:600}
.snav a{padding:10px 12px;border-radius:10px}.snav a.on{background:var(--panel2);color:var(--fg)}
.snav a svg,.tabbar a svg,.lockbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.snav a.on svg{color:var(--acc)}
.sfoot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:0 12px}
.lockbtn{display:flex;align-items:center;gap:8px;background:none;border:1px solid var(--line);color:var(--muted);font:inherit;
font-size:13px;padding:8px 10px;border-radius:10px;cursor:pointer}
.upd{color:var(--muted);font-size:12px}.upd.stale{color:var(--down);font-weight:700}
.main{padding:28px 32px 48px;display:flex;flex-direction:column;gap:20px;max-width:1320px;width:100%;min-width:0;margin:0 auto}
.masonry{column-count:2;column-gap:18px}.masonry>*{break-inside:avoid;display:inline-block;width:100%;margin:0 0 18px;vertical-align:top}
.simsec{display:flex;flex-direction:column;gap:18px}.simsec .cols{align-items:stretch}
.wf-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px 12px;padding:10px 0;
border-bottom:1px solid var(--line)}.wf-row .seg{margin:0}
.step{display:flex;align-items:center;gap:6px}.step b{min-width:92px;text-align:center;font-size:15px}
.step button{width:36px;height:36px;border-radius:10px;border:0;background:var(--panel2);color:var(--acc);font:inherit;
font-size:20px;font-weight:700;cursor:pointer;touch-action:manipulation}.step button:active{background:#26302b}
.kdot{display:inline-block;width:8px;height:8px;border-radius:9px;margin-right:8px;vertical-align:1px}
.wf-res{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding:14px 0 4px}
.wf-res .big{font-size:30px;font-weight:800;color:var(--up);letter-spacing:-.02em}
.wf-rates{margin:8px 0 0}
.simtop{align-items:stretch}.sech.big2{font-size:17px;margin-top:8px}
.fgtop{display:flex;align-items:center;gap:14px;margin:6px 0 14px}.fgv{font-size:38px;font-weight:800;line-height:1;min-width:56px}
.gauge{position:relative;height:10px;border-radius:9px;margin:22px 0 6px;
background:linear-gradient(90deg,#ff6b5e,#ffb43c 40%,#8d9a92 50%,#2fd28b 75%)}
.gauge i{position:absolute;top:50%;transform:translate(-50%,-50%)}
.gauge .mk{width:20px;height:20px;border-radius:50%;background:var(--fg);border:4px solid var(--bg);box-shadow:0 0 0 1px var(--line)}
.gauge .th{width:2px;height:20px;background:var(--fg);opacity:.8}
.gauge .th span{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--muted);font-style:normal}
.gl{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}
.kpis.k2{grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:16px}.fgy .kpi{background:var(--panel2)}
.mbars{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;height:130px;align-items:end}
.mbars div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.mbars i{width:100%;max-width:26px;border-radius:5px 5px 2px 2px;opacity:.85}
.mbars b{font-size:11px}.mbars span{font-size:10px;color:var(--muted)}.mref{margin:8px 0 4px}
.mtop{display:none}
.panel{display:flex;flex-direction:column;gap:18px}.panel[hidden]{display:none}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;gap:6px;align-items:center;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;
background:var(--panel2);color:var(--muted);white-space:nowrap}
.pill.up{background:rgba(47,210,139,.12);color:var(--up)}.pill.down{background:rgba(255,107,94,.12);color:var(--down)}
.pill.warn{background:rgba(255,180,60,.12);color:var(--warn)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}
.hero .big{font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin:2px 0 8px}
.herotop{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi .v{font-size:20px;font-weight:700;margin-top:4px}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
.ttl{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.list .row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.list .row>.mid{flex:1;min-width:0}.list .row>.av,.list .row>.spark{flex:none}.list .row>.end{flex:none;min-width:84px}
.list .ttl+.row{border-top:0}
.av{width:36px;height:36px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;font-size:10px;font-weight:700;color:var(--muted)}
.mid .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.t.wrap{white-space:normal}
.end{text-align:right;display:flex;flex-direction:column;align-items:flex-end;white-space:nowrap}
.spark{width:84px;height:26px;display:block}.spark polyline{fill:none;stroke-width:1.8;stroke-linejoin:round}
.spark.up polyline{stroke:var(--up)}.spark.down polyline{stroke:var(--down)}
.meter{height:4px;background:var(--panel2);border-radius:2px;margin-top:6px;overflow:hidden}.meter i{display:block;height:100%;background:var(--acc)}
.how summary{cursor:pointer;font-weight:600}.how p{color:var(--muted);margin:10px 0 0}
.errors{border-color:rgba(255,107,94,.5)}.errors ul{margin:8px 0 0;padding-left:1.2em;color:var(--muted);font-size:13px}
.sech{font-size:16px;margin:6px 0 10px}
table{width:100%;border-collapse:collapse;margin-top:12px}th{text-align:left;font-size:11px;color:var(--muted);font-weight:600;
text-transform:uppercase;letter-spacing:.05em;padding:8px 0;border-bottom:1px solid var(--line)}td{padding:8px 0;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}.r{text-align:right}
footer{color:var(--muted);font-size:12px}
/* gráficas interactivas */
.ichart{position:relative;margin-top:12px;touch-action:pan-y}
.seg{display:inline-flex;background:var(--panel2);border-radius:10px;padding:3px;margin-bottom:8px}
.seg button{background:none;border:0;color:var(--muted);font:inherit;font-size:12px;font-weight:600;padding:5px 12px;border-radius:8px;cursor:pointer}
.seg button.on{background:#26302b;color:var(--fg)}
.ichart svg{display:block;width:100%;overflow:visible}
.gl{stroke:#1d2521}.tk{fill:var(--muted);font-size:11px;font-family:var(--font)}.ref{stroke:#55605a;stroke-dasharray:4 5}
.ln{fill:none;stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}.ln.main{stroke:var(--up)}.ln.dash{stroke:var(--muted);stroke-dasharray:6 5;stroke-width:1.8}
.cross{stroke:#6b7a72;stroke-dasharray:3 4}.dot{stroke:var(--bg);stroke-width:3}.dot.main{fill:var(--up)}.dot.dash{fill:var(--muted)}
.tip{position:absolute;top:44px;pointer-events:none;background:#1f2924;border:1px solid #2f3b35;border-radius:10px;padding:8px 10px;
font-size:12px;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.35)}.tip .tv{font-size:15px;font-weight:700}.tip[hidden]{display:none}
.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-top:8px}
.legend i{display:inline-block;width:18px;border-top:2px solid var(--up);margin-right:6px;vertical-align:middle}.legend i.dash{border-top:2px dashed var(--muted)}
.alloc{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px;margin:12px 0 8px}.alloc i{display:block;height:100%}
.keys{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.keys span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--k)}
.tabbar{display:none}
/* móvil */
@media (max-width:899px){
.app{grid-template-columns:minmax(0,1fr)}.side{display:none}
.main{padding:max(14px,env(safe-area-inset-top)) 14px calc(90px + env(safe-area-inset-bottom)) 14px;gap:14px}
.mtop{display:flex;align-items:center;justify-content:space-between;gap:10px}.mtop .upd{margin-left:auto}
.lockbtn.icon{padding:6px;border:0}
.pagehead h1{font-size:18px}
.hero .big{font-size:34px}
.kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.kpi .v{font-size:17px}
.cols{grid-template-columns:minmax(0,1fr);gap:14px}.masonry{column-count:1}.masonry>*{margin-bottom:14px}
.card{padding:16px;border-radius:14px}
.list .row{gap:10px}.spark{width:60px}.list .row>.end{min-width:72px}
.tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:5;justify-content:space-around;
background:rgba(18,24,21,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);
padding:8px 0 calc(10px + env(safe-area-inset-bottom))}
.tabbar a{flex-direction:column;gap:3px;font-size:11px}.tabbar a.on{color:var(--acc)}.tabbar a svg{width:24px;height:24px}
}

(function(){

function fdate(t,long){var o=long?{day:'numeric',month:'short',year:'numeric'}:{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'};
 o.timeZone='Europe/Madrid';return new Date(t*1000).toLocaleString('es-ES',o);}
var NS='http://www.w3.org/2000/svg';
function el(n,a){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);return e;}
function chart(host){
 var cfg=JSON.parse(host.getAttribute('data-chart')),cur=cfg.def||'Todo';
 var seg=null;
 if(cfg.ranges&&cfg.ranges.length){seg=document.createElement('div');seg.className='seg';
  cfg.ranges.forEach(function(r){var b=document.createElement('button');b.type='button';b.textContent=r[0];
   b.onclick=function(){cur=r[0];draw();};seg.appendChild(b);});host.appendChild(seg);}
 var box=document.createElement('div');box.style.position='relative';host.appendChild(box);
 var tip=document.createElement('div');tip.className='tip';tip.hidden=true;box.appendChild(tip);
 if(cfg.series.length>1){var lg=document.createElement('div');lg.className='legend';
  cfg.series.forEach(function(s){var sp=document.createElement('span');var i=document.createElement('i');
   if(s.kind==='dash')i.className='dash';sp.appendChild(i);sp.appendChild(document.createTextNode(s.name));lg.appendChild(sp);});
  host.appendChild(lg);}
 var svg=null;
 function draw(){
  if(seg)Array.prototype.forEach.call(seg.children,function(b){b.className=b.textContent===cur?'on':'';});
  var secs=0;(cfg.ranges||[]).forEach(function(r){if(r[0]===cur)secs=r[1];});
  var last=0;cfg.series.forEach(function(s){last=Math.max(last,s.points[s.points.length-1][0]);});
  var ser=cfg.series.map(function(s){var p=secs?s.points.filter(function(q){return q[0]>=last-secs;}):s.points;
   if(p.length<2)p=s.points.slice(-2);return {name:s.name,kind:s.kind,p:p};});
  var W=Math.max(260,box.clientWidth||host.clientWidth||600),H=cfg.h||260,ml=6,mr=58,mt=12,mb=26;
  if(W<500)H=Math.min(H,220);
  var t0=Infinity,t1=-Infinity,lo=Infinity,hi=-Infinity;
  ser.forEach(function(s){s.p.forEach(function(q){t0=Math.min(t0,q[0]);t1=Math.max(t1,q[0]);lo=Math.min(lo,q[1]);hi=Math.max(hi,q[1]);});});
  if(cfg.ref!=null&&!secs){lo=Math.min(lo,cfg.ref);hi=Math.max(hi,cfg.ref);}
  var pad=(hi-lo)*0.12||Math.abs(hi)*0.01||1;lo-=pad;hi+=pad;var span=Math.max(t1-t0,1);
  function X(t){return ml+(t-t0)/span*(W-ml-mr);}function Y(v){return mt+(hi-v)/(hi-lo)*(H-mt-mb);}
  if(svg)box.removeChild(svg);svg=el('svg',{viewBox:'0 0 '+W+' '+H,height:H});box.insertBefore(svg,tip);
  var gid='g'+Math.random().toString(36).slice(2);var defs=el('defs',{}),lg=el('linearGradient',{id:gid,x1:0,y1:0,x2:0,y2:1});
  lg.appendChild(el('stop',{offset:0,'stop-color':'#2fd28b','stop-opacity':.28}));lg.appendChild(el('stop',{offset:1,'stop-color':'#2fd28b','stop-opacity':0}));
  defs.appendChild(lg);svg.appendChild(defs);
  for(var k=0;k<4;k++){var v=lo+(hi-lo)*(k+.5)/4;svg.appendChild(el('line',{x1:ml,x2:W-mr,y1:Y(v),y2:Y(v),'class':'gl'}));
   var tx=el('text',{x:W-mr+8,y:Y(v)+4,'class':'tk'});tx.textContent=cfg.unit!=null?NF0.format(v)+cfg.unit:(hi-lo>40?NF0:NF2).format(v)+' €';svg.appendChild(tx);}
  if(cfg.ref!=null&&cfg.ref>lo&&cfg.ref<hi)svg.appendChild(el('line',{x1:ml,x2:W-mr,y1:Y(cfg.ref),y2:Y(cfg.ref),'class':'ref'}));
  var long=span>86400*120;
  [0,.5,1].forEach(function(f,i){var t=t0+span*f;var tx=el('text',{x:X(t),y:H-6,'class':'tk','text-anchor':['start','middle','end'][i]});
   tx.textContent=fdate(t,long);svg.appendChild(tx);});
  ser.slice().reverse().forEach(function(s){var pts=s.p.map(function(q){return X(q[0]).toFixed(1)+','+Y(q[1]).toFixed(1);}).join(' ');
   if(s.kind!=='dash'){svg.appendChild(el('polygon',{points:X(s.p[0][0]).toFixed(1)+','+(H-mb)+' '+pts+' '+X(s.p[s.p.length-1][0]).toFixed(1)+','+(H-mb),fill:'url(#'+gid+')'}));}
   svg.appendChild(el('polyline',{points:pts,'class':'ln '+(s.kind||'main')}));});
  var cross=el('line',{y1:mt,y2:H-mb,'class':'cross',visibility:'hidden'});svg.appendChild(cross);
  var dots=ser.map(function(s){var d=el('circle',{r:5,'class':'dot '+(s.kind||'main'),visibility:'hidden'});svg.appendChild(d);return d;});
  function near(p,t){var b=0,bd=Infinity;for(var i=0;i<p.length;i++){var dd=Math.abs(p[i][0]-t);if(dd<bd){bd=dd;b=i;}}return p[b];}
  function move(e){var r=svg.getBoundingClientRect();var cx=((e.touches?e.touches[0].clientX:e.clientX)-r.left)*W/r.width;
   var t=t0+(cx-ml)/(W-ml-mr)*span;t=Math.max(t0,Math.min(t1,t));var q0=near(ser[0].p,t);var x=X(q0[0]);
   cross.setAttribute('x1',x);cross.setAttribute('x2',x);cross.setAttribute('visibility','visible');
   var html='<div class="s">'+fdate(q0[0],long)+'</div>';
   ser.forEach(function(s,i){var q=near(s.p,q0[0]);dots[i].setAttribute('cx',X(q[0]));dots[i].setAttribute('cy',Y(q[1]));
    dots[i].setAttribute('visibility','visible');html+='<div class="'+(i?'s':'tv')+'">'+(ser.length>1?s.name+': ':'')+(cfg.unit!=null?NF0.format(q[1])+cfg.unit:eur(q[1]))+'</div>';});
   tip.innerHTML=html;tip.hidden=false;var px=x*r.width/W;var tw=tip.offsetWidth;
   tip.style.left=Math.max(0,Math.min(r.width-tw,px+12>r.width-tw?px-tw-12:px+12))+'px';tip.style.top='8px';}
  function leave(){tip.hidden=true;cross.setAttribute('visibility','hidden');dots.forEach(function(d){d.setAttribute('visibility','hidden');});}
  svg.addEventListener('mousemove',move);svg.addEventListener('touchstart',move,{passive:true});
  svg.addEventListener('touchmove',move,{passive:true});svg.addEventListener('mouseleave',leave);svg.addEventListener('touchend',function(){setTimeout(leave,1500);});
 }
 draw();var rt;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(draw,150);});
}
function whatif(card){
 var base=JSON.parse(card.getAttribute('data-base')),years=10,sc='n',x={xc:0,xr:0};
 var SC={p:{n:'Prudente',rc:-10,rr:5},n:{n:'Normal',rc:7,rr:7},o:{n:'Optimista',rc:20,rr:9}};
 function q(s){return card.querySelector(s);}function qa(s){return Array.prototype.slice.call(card.querySelectorAll(s));}
 qa('.step').forEach(function(st){var k=st.getAttribute('data-k');st.querySelectorAll('button').forEach(function(b){
  b.onclick=function(){x[k]=Math.max(0,Math.min(2000,x[k]+(+b.getAttribute('data-d'))));run();};});});
 function seg(sel,attr,set){qa(sel+' button').forEach(function(b){b.onclick=function(){set(b.getAttribute(attr));
  qa(sel+' button').forEach(function(o){o.className=o===b?'on':'';});run();};});}
 seg('.wf-y','data-y',function(v){years=+v;});seg('.wf-s','data-s',function(v){sc=v;});
 function sim(xc,xr,rc,rr){var c=base.vc,r=base.vr,put=base.vc+base.vr,pts=[],now=Date.now()/1000;
  var gc=Math.pow(1+rc/100,1/12),gr=Math.pow(1+rr/100,1/12);pts.push([now,c+r]);
  for(var m=1;m<=years*12;m++){c=c*gc+xc;r=r*gr+base.mr+xr;put+=xc+xr+base.mr;pts.push([now+m*2629800,c+r]);}
  return {pts:pts,end:c+r,put:put};}
 function run(){var s=SC[sc];
  q('[data-k=xc] b').textContent=NF0.format(x.xc)+' €/mes';q('[data-k=xr] b').textContent=NF0.format(x.xr)+' €/mes';
  var a=sim(0,0,s.rc,s.rr),b=sim(x.xc,x.xr,s.rc,s.rr),diff=b.end-a.end;
  q('.wf-res').innerHTML='<div><div class="l">En '+years+' años tendrías</div><div class="big num">'+eur(b.end)+'</div>'
   +'<div class="s">'+(diff>0.5?'frente a '+eur(a.end)+' con tus planes · ':'con tus planes actuales · ')+'aportarías '+eur(b.put)+'</div></div>'
   +(diff>0.5?'<span class="pill up">+'+eur(diff)+'</span>':'<span class="s">pulsa + para añadir</span>');
  q('.wf-rates').textContent=s.n+': fondos y acciones '+s.rr+' % al año, cripto '+(s.rc>0?'+':'')+s.rc+' % al año. Es una estimación, no una promesa.';
  var host=q('.wf-chart');host.innerHTML='';var h=document.createElement('div');h.className='ichart';h.setAttribute('data-done','1');
  var se=[{name:'Con lo extra',kind:'main',points:b.pts}];if(diff>0.5)se.push({name:'Con tus planes',kind:'dash',points:a.pts});
  h.setAttribute('data-chart',JSON.stringify({series:se,ranges:[],def:'Todo',h:200}));host.appendChild(h);chart(h);}

}
